<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style></head><body>
<title>Twisty Cube 3×3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: one-screen puzzle app — slim header with stats, cube stage fills the middle, notation pad docked at the bottom. */
  :root {
    --bg: #e7e9ed; --panel: #f6f7f9; --fg: #16181d; --muted: #5b626e; --line: #d2d6dd;
    --accent: #1f5fd6; --good: #12805c; --key: #ffffff; --key-hover: #eef2fb;
    --display: "Sora", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #111318; --panel: #1a1d23; --fg: #eceef2; --muted: #9aa1ad; --line: #2b3039;
    --accent: #6b97ff; --good: #3fcf9a; --key: #20242b; --key-hover: #272c35; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #111318; --panel: #1a1d23; --fg: #eceef2; --muted: #9aa1ad; --line: #2b3039;
    --accent: #6b97ff; --good: #3fcf9a; --key: #20242b; --key-hover: #272c35; color-scheme: dark }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--display); }
  .app {
    height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px; box-sizing: border-box; max-width: 980px; margin: 0 auto;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h1 small { display: block; font-size: 0.75rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
  .stats { display: flex; gap: 18px; align-items: center; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .stat { display: flex; flex-direction: column; }
  .stat span { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .stat b { font-size: 1.05rem; }
  .pill { font-family: var(--mono); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.solved { color: var(--good); border-color: var(--good); }
  .pill.scrambled { color: var(--accent); border-color: var(--accent); }

  .stage { position: relative; min-height: 0; border-radius: 14px; overflow: hidden; background: var(--stage-bg, #d9dbe0);
    --stage-ink: #4a505b; --chip-bg: rgba(255,255,255,0.72); --chip-on: #16181d; --chip-on-ink: #fff; }
  .stage[data-env="night"] { --stage-ink: #b4bbc7; --chip-bg: rgba(20,22,27,0.6); --chip-on: #eceef2; --chip-on-ink: #16181d; }
  .stage[data-env="sunset"] { --stage-ink: #6a4632; --chip-bg: rgba(255,244,234,0.7); --chip-on: #4a2c1c; --chip-on-ink: #fff; }
  .envs { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; padding: 3px; border-radius: 10px;
    background: var(--chip-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .envs button { border: 0; background: transparent; color: var(--stage-ink); font-size: 0.75rem; font-weight: 500;
    padding: 5px 10px; border-radius: 7px; }
  .envs button:hover { background: transparent; text-decoration: underline; }
  .envs button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); text-decoration: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
  #view.turning { cursor: grabbing; }
  .hint { position: absolute; left: 12px; bottom: 10px; font-size: 0.75rem; color: var(--stage-ink); pointer-events: none; max-width: 36ch; }
  .last { position: absolute; right: 12px; bottom: 10px; font-family: var(--mono); font-size: 0.8rem; color: var(--stage-ink);
    max-width: 60%; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

  .controls { display: flex; justify-content: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .pad { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 520px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--key); color: var(--fg);
    padding: 9px 6px; min-width: 0; }
  button:hover { background: var(--key-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  .pad button { font-family: var(--mono); font-weight: 700; font-size: 0.95rem; position: relative; }
  .pad button i { position: absolute; left: 6px; top: 50%; width: 6px; height: 6px; border-radius: 2px; transform: translateY(-50%); }
  .actions button { font-size: 0.85rem; font-weight: 500; padding-inline: 14px; }
  .actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions .primary:hover { filter: brightness(1.08); background: var(--accent); }
  .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; font-family: var(--mono); }

  @media (max-width: 620px) {
    .actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .actions button { padding-inline: 4px; }
    .hint { display: none; }
    .last { max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Twisty Cube 3×3<small>Drag a face to turn it. Drag empty space to look around.</small></h1>
    <div class="stats">
      <div class="stat"><span>Moves</span><b id="moves">0</b></div>
      <div class="stat"><span>Time</span><b id="time">0:00.0</b></div>
      <div id="status" class="pill solved">Solved</div>
    </div>
  </header>

  <div class="stage" id="stage" data-env="studio">
    <canvas id="view" aria-label="3D puzzle cube. Drag a sticker to turn its layer, drag the background to rotate the view."></canvas>
    <div class="envs" role="group" aria-label="Environment">
      <button type="button" data-env="studio" aria-pressed="true">Studio</button>
      <button type="button" data-env="night" aria-pressed="false">Night</button>
      <button type="button" data-env="sunset" aria-pressed="false">Sunset</button>
    </div>
    <div class="hint">Keys: U D L R F B M E S turn a layer, hold Shift for the counter-clockwise turn. Ctrl+Z undoes.</div>
    <div class="last" id="last"></div>
  </div>

  <div class="controls">
    <div class="actions">
      <button id="scramble" class="primary">Scramble</button>
      <button id="solve">Solve</button>
      <button id="undo">Undo</button>
      <button id="reset">Reset</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // Colour scheme matches the reference photo: yellow on top, blue front, red right.
  const FACE = {
    U: { color: 0xffd400, n: [0, 1, 0] }, D: { color: 0xf4f4f4, n: [0, -1, 0] },
    F: { color: 0x1d5ad8, n: [0, 0, 1] }, B: { color: 0x0e9a52, n: [0, 0, -1] },
    R: { color: 0xd8232a, n: [1, 0, 0] }, L: { color: 0xff7a00, n: [-1, 0, 0] },
  };
  // Notation: letter -> axis, layer, and rotation sign for a clockwise turn (seen facing that side).
  const NOTATION = {
    R: ['x', 1, -1], L: ['x', -1, 1], M: ['x', 0, 1],
    U: ['y', 1, -1], D: ['y', -1, 1], E: ['y', 0, 1],
    F: ['z', 1, -1], B: ['z', -1, 1], S: ['z', 0, -1],
  };

  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;          // PCF honours shadow.radius, giving a soft contact shadow
  const srgb = hex => new THREE.Color(hex).convertSRGBToLinear();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  const orbit = { theta: 0.684, phi: 1.02, r: 10.5 };   // same viewpoint as the Blender camera

  const pmrem = new THREE.PMREMGenerator(renderer);

  const key = new THREE.DirectionalLight(0xffffff, 1.15);
  key.position.set(3, 8, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
  key.shadow.radius = 9;
  key.shadow.bias = -0.0004;
  scene.add(key);

  const floorMat = new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0, envMapIntensity: 0.35 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -1.56;                               // same floor height as the Blender scene
  floor.receiveShadow = true;
  scene.add(floor);

  // --- Environments: a seamless studio floor that fades into a matching backdrop (fog),
  // plus the reflections the pieces pick up. Each one is a small light room baked to an env map.
  const ENVS = {
    studio: { bg: 0xd9dbe0, room: 0x8e9198, boxes: [5, 1.6, 1.2], key: 0xffffff, keyI: 1.15, hemi: 0.15, fog: [13, 32] },
    night:  { bg: 0x1f2229, room: 0x30333b, boxes: [4, 0.9, 1.4], key: 0xcfdcff, keyI: 1.0,  hemi: 0.08, fog: [12, 28] },
    sunset: { bg: 0xeec7a6, room: 0x9b7a66, boxes: [5, 1.4, 1.6], key: 0xffd2a3, keyI: 1.2,  hemi: 0.18, fog: [13, 30] },
  };
  const hemi = new THREE.HemisphereLight(0xffffff, 0x9aa0aa, 0.15);
  scene.add(hemi);
  let envTex = null;
  function applyEnv(name) {
    const e = ENVS[name] || ENVS.studio;
    const bg = srgb(e.bg);
    scene.background = bg;
    scene.fog = new THREE.Fog(bg, e.fog[0], e.fog[1]);
    floorMat.color.copy(bg);
    key.color.copy(srgb(e.key)); key.intensity = e.keyI; hemi.intensity = e.hemi;

    const studio = new THREE.Scene();
    studio.add(new THREE.Mesh(new THREE.BoxGeometry(30, 30, 30),
      new THREE.MeshBasicMaterial({ color: srgb(e.room), side: THREE.BackSide })));
    const tint = srgb(e.key);
    [[9, 9, [4, 12, 6]], [10, 6, [-13, 4, 3]], [8, 4, [6, 1, 13]]].forEach(([w, h, pos], i) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({
        color: tint.clone().multiplyScalar(e.boxes[i]), side: THREE.DoubleSide }));
      m.position.set(...pos); m.lookAt(0, 0, 0); studio.add(m);
    });
    const next = pmrem.fromScene(studio, 0.035).texture;
    scene.environment = next;
    if (envTex) envTex.dispose();
    envTex = next;
    studio.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });

    const stage = document.getElementById('stage');
    stage.dataset.env = name;
    stage.style.setProperty('--stage-bg', '#' + e.bg.toString(16).padStart(6, '0'));
    document.querySelectorAll('.envs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.env === name)));
    try { localStorage.setItem('twisty-env', name); } catch (err) { /* storage unavailable */ }
  }
  let startEnv = 'studio';
  try { startEnv = localStorage.getItem('twisty-env') || 'studio'; } catch (err) { /* storage unavailable */ }
  applyEnv(ENVS[startEnv] ? startEnv : 'studio');
  document.querySelectorAll('.envs button').forEach(b => b.addEventListener('click', () => applyEnv(b.dataset.env)));

  // Soft contact shadow under the cube, like the area-light shadow in the Blender render.
  const blob = document.createElement('canvas');
  blob.width = blob.height = 256;
  const bctx = blob.getContext('2d');
  const grad = bctx.createRadialGradient(128, 128, 10, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.42)'); grad.addColorStop(0.45, 'rgba(0,0,0,0.22)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
  bctx.fillStyle = grad; bctx.fillRect(0, 0, 256, 256);
  const contact = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 5.2),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(blob), transparent: true, depthWrite: false }));
  contact.rotation.x = -Math.PI / 2;
  contact.position.set(-0.25, -1.555, -0.25);
  contact.renderOrder = -1;
  scene.add(contact);

  // --- Build the 27 pieces ---
  function roundedRect(size, r) {
    const s = size / 2, sh = new THREE.Shape();
    sh.moveTo(-s + r, -s); sh.lineTo(s - r, -s); sh.quadraticCurveTo(s, -s, s, -s + r);
    sh.lineTo(s, s - r); sh.quadraticCurveTo(s, s, s - r, s); sh.lineTo(-s + r, s);
    sh.quadraticCurveTo(-s, s, -s, s - r); sh.lineTo(-s, -s + r); sh.quadraticCurveTo(-s, -s, -s + r, -s);
    return new THREE.ShapeGeometry(sh, 8);
  }
  // Box with rounded edges and corners (like Blender's Bevel modifier): vertices are bunched
  // towards the edges, then pushed out onto a sphere of radius r around the inner box.
  function roundedBox(size, r, n) {
    const S = 2 * n + 1, h = size / 2, inner = h - r;
    const g = new THREE.BoxGeometry(1, 1, 1, S, S, S);
    const pos = g.attributes.position, nor = g.attributes.normal;
    const remap = c => { const i = Math.round((c + 0.5) * S); return i <= n ? -h + r * i / n : h - r * (S - i) / n; };
    const clamp = v => Math.max(-inner, Math.min(inner, v));
    const p = new THREE.Vector3(), q = new THREE.Vector3(), d = new THREE.Vector3();
    for (let k = 0; k < pos.count; k++) {
      p.set(remap(pos.getX(k)), remap(pos.getY(k)), remap(pos.getZ(k)));
      q.set(clamp(p.x), clamp(p.y), clamp(p.z));
      d.subVectors(p, q).normalize();
      p.copy(q).addScaledVector(d, r);
      pos.setXYZ(k, p.x, p.y, p.z);
      nor.setXYZ(k, d.x, d.y, d.z);
    }
    return g;
  }
  const bodyGeo = roundedBox(0.96, 0.075, 4);
  const bodyMat = new THREE.MeshStandardMaterial({ color: srgb(0x111113), roughness: 0.42, metalness: 0.0, envMapIntensity: 0.9 });
  const stickerGeo = roundedRect(0.78, 0.09);
  const stickerMats = {};
  for (const k in FACE) stickerMats[k] = new THREE.MeshPhysicalMaterial({
    color: srgb(FACE[k].color), roughness: 0.32, metalness: 0.0, clearcoat: 0.55, clearcoatRoughness: 0.18,
    envMapIntensity: 0.8, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
  });

  let cubies = [], pickables = [];
  function build() {
    cubies.forEach(c => scene.remove(c));
    cubies = []; pickables = [];
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      body.receiveShadow = false;
      g.add(body); pickables.push(body);
      for (const k in FACE) {
        const [nx, ny, nz] = FACE[k].n;
        if ((nx && nx !== x) || (ny && ny !== y) || (nz && nz !== z)) continue;
        const s = new THREE.Mesh(stickerGeo, stickerMats[k]);
        s.position.set(nx * 0.4815, ny * 0.4815, nz * 0.4815);
        s.lookAt(nx * 2, ny * 2, nz * 2);
        s.userData = { face: k, normal: new THREE.Vector3(nx, ny, nz) };
        g.add(s); pickables.push(s);
      }
      scene.add(g); cubies.push(g);
    }
  }
  build();

  // --- Move engine ---
  const pivot = new THREE.Group();
  scene.add(pivot);
  const queue = [];
  let active = null, history = [], userMoves = 0, scrambled = false;
  let timerStart = 0, timerEnd = 0, timing = false, auto = false;

  const ui = {
    moves: document.getElementById('moves'), time: document.getElementById('time'),
    status: document.getElementById('status'), last: document.getElementById('last'),
    scramble: document.getElementById('scramble'), solve: document.getElementById('solve'),
    undo: document.getElementById('undo'), reset: document.getElementById('reset'),
  };

  function moveName(m) {
    for (const L in NOTATION) {
      const [a, layer, cw] = NOTATION[L];
      if (a === m.axis && layer === m.layer) return L + (m.dir === cw ? '' : "'");
    }
    return '?';
  }
  function enqueue(m, opts = {}) { queue.push(Object.assign({}, m, { record: true, speed: 190 }, opts)); }
  function busy() { return auto || active || queue.length; }

  function startNext() {
    if (!queue.length) {
      if (auto) { auto = false; afterAuto(); }
      return;
    }
    const m = queue.shift();
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();
    const group = cubies.filter(c => Math.round(c.position[m.axis]) === m.layer);
    group.forEach(c => pivot.attach(c));
    active = { m, group, t0: performance.now() };
  }

  const snapM = new THREE.Matrix4();
  function finishActive() {
    const { m, group } = active;
    pivot.rotation[m.axis] = m.dir * Math.PI / 2;
    pivot.updateMatrixWorld();
    group.forEach(c => {
      scene.attach(c);
      c.position.set(Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z));
      snapM.makeRotationFromQuaternion(c.quaternion);
      const e = snapM.elements;
      for (let i = 0; i < 16; i++) e[i] = Math.round(e[i]);
      c.quaternion.setFromRotationMatrix(snapM);
    });
    pivot.rotation.set(0, 0, 0);
    active = null;
    if (m.record) history.push({ axis: m.axis, layer: m.layer, dir: m.dir });
    if (m.user) {
      userMoves++;
      if (scrambled && !timing && !timerEnd) { timing = true; timerStart = performance.now(); }
      ui.last.textContent = history.slice(-14).map(moveName).join(' ');
      checkSolved();
    }
    if (m.undo) { userMoves = Math.max(0, userMoves - 1); ui.last.textContent = history.slice(-14).map(moveName).join(' '); checkSolved(); }
    refresh();
  }

  const tmpN = new THREE.Vector3();
  function isSolved() {
    const seen = {};
    for (const c of cubies) for (const s of c.children) {
      if (!s.userData.face) continue;
      tmpN.copy(s.userData.normal).applyQuaternion(c.quaternion);
      const dirKey = Math.round(tmpN.x) + ',' + Math.round(tmpN.y) + ',' + Math.round(tmpN.z);
      if (seen[dirKey] === undefined) seen[dirKey] = s.userData.face;
      else if (seen[dirKey] !== s.userData.face) return false;
    }
    return true;
  }
  function checkSolved() {
    if (isSolved()) {
      if (timing) { timing = false; timerEnd = performance.now(); }
      scrambled = false;
      setStatus('solved', timerEnd ? 'Solved!' : 'Solved');
    } else {
      setStatus('scrambled', 'Scrambled');
    }
  }
  function setStatus(cls, text) { ui.status.className = 'pill ' + cls; ui.status.textContent = text; }

  function refresh() {
    ui.moves.textContent = userMoves;
    const b = !!(auto || queue.length > 1);
    ui.scramble.disabled = b; ui.solve.disabled = b || !history.length; ui.undo.disabled = b || !history.length; ui.reset.disabled = b;
    document.querySelectorAll('.pad button').forEach(x => x.disabled = b);
  }
  function fmt(ms) {
    const s = ms / 1000, m = Math.floor(s / 60);
    return m + ':' + (s % 60).toFixed(1).padStart(4, '0');
  }

  let afterAuto = () => {};
  function doScramble() {
    if (busy()) return;
    const axes = ['x', 'y', 'z'];
    let prev = null;
    for (let i = 0; i < 22; i++) {
      let axis; do { axis = axes[Math.floor(Math.random() * 3)]; } while (axis === prev);
      prev = axis;
      enqueue({ axis, layer: Math.random() < 0.5 ? -1 : 1, dir: Math.random() < 0.5 ? -1 : 1 }, { speed: 85 });
    }
    auto = true;
    timing = false; timerEnd = 0; timerStart = 0; userMoves = 0;
    ui.time.textContent = fmt(0); ui.last.textContent = '';
    afterAuto = () => { scrambled = true; checkSolved(); refresh(); };
    setStatus('', 'Scrambling…');
    refresh();
  }
  function doSolve() {
    if (busy() || !history.length) return;
    const steps = history.slice().reverse();
    history = [];
    const speed = Math.max(55, Math.min(140, 2600 / steps.length));
    steps.forEach(m => enqueue({ axis: m.axis, layer: m.layer, dir: -m.dir }, { record: false, speed }));
    auto = true; timing = false; scrambled = false;
    afterAuto = () => { userMoves = 0; ui.last.textContent = ''; checkSolved(); setStatus('solved', 'Solved'); refresh(); };
    setStatus('', 'Solving…');
    refresh();
  }
  function doUndo() {
    if (busy() || !history.length) return;
    const m = history.pop();
    enqueue({ axis: m.axis, layer: m.layer, dir: -m.dir }, { record: false, undo: true, speed: 160 });
    refresh();
  }
  function doReset() {
    if (busy()) return;
    build(); history = []; userMoves = 0; scrambled = false; timing = false; timerEnd = 0;
    ui.time.textContent = fmt(0); ui.last.textContent = '';
    setStatus('solved', 'Solved'); refresh();
  }
  function userTurn(letter, prime) {
    if (auto) return;
    const [axis, layer, cw] = NOTATION[letter];
    if (queue.length > 2) return;
    enqueue({ axis, layer, dir: prime ? -cw : cw }, { user: true });
  }

  ui.scramble.addEventListener('click', doScramble);
  ui.solve.addEventListener('click', doSolve);
  ui.undo.addEventListener('click', doUndo);
  ui.reset.addEventListener('click', doReset);

  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const L = e.key.toUpperCase();
    if (NOTATION[L]) { e.preventDefault(); userTurn(L, e.shiftKey); }
  });

  // --- Pointer: drag sticker to turn, drag background to orbit ---
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let drag = null;
  function toNdc(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    return r;
  }
  function toScreen(v, r) {
    const p = v.clone().project(camera);
    return new THREE.Vector2((p.x + 1) / 2 * r.width, (1 - p.y) / 2 * r.height);
  }
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    toNdc(e);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    drag = { x: e.clientX, y: e.clientY, mode: 'orbit', done: false };
    if (hit && !auto) {
      const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      const ax = ['x', 'y', 'z'].reduce((a, b) => Math.abs(n[b]) > Math.abs(n[a]) ? b : a);
      const normal = new THREE.Vector3(); normal[ax] = Math.sign(n[ax]);
      drag = Object.assign(drag, { mode: 'turn', cubie: hit.object.parent, point: hit.point.clone(), normal, nAxis: ax });
    }
    canvas.classList.add('turning');
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (drag.mode === 'orbit') {
      orbit.theta -= dx * 0.008;
      orbit.phi = Math.min(1.68, Math.max(0.25, orbit.phi - dy * 0.008));
      drag.x = e.clientX; drag.y = e.clientY;
      return;
    }
    if (drag.done || Math.hypot(dx, dy) < 12) return;
    const r = canvas.getBoundingClientRect();
    const dragV = new THREE.Vector2(dx, dy).normalize();
    const p0 = toScreen(drag.point, r);
    let best = null;
    for (const a of ['x', 'y', 'z']) {
      if (a === drag.nAxis) continue;
      const axisV = new THREE.Vector3(); axisV[a] = 1;
      const tangent = axisV.clone().cross(drag.normal);       // motion of the touched sticker for +90° about this axis
      const sv = toScreen(drag.point.clone().addScaledVector(tangent, 0.5), r).sub(p0);
      if (sv.lengthSq() < 1) continue;
      const score = sv.normalize().dot(dragV);
      if (!best || Math.abs(score) > Math.abs(best.score)) best = { a, score };
    }
    if (best) {
      drag.done = true;
      const layer = Math.round(drag.cubie.position[best.a]);
      if (queue.length <= 2) enqueue({ axis: best.a, layer, dir: Math.sign(best.score) }, { user: true });
    }
  });
  const endDrag = () => { drag = null; canvas.classList.remove('turning'); };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // --- Render loop ---
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) {
      renderer.setSize(w, h, false);
    }
    camera.aspect = w / h;
    orbit.r = camera.aspect < 1 ? 10.5 / Math.max(0.55, camera.aspect) : 10.5;
    camera.updateProjectionMatrix();
  }
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function frame(now) {
    resize();
    camera.position.set(
      orbit.r * Math.sin(orbit.phi) * Math.sin(orbit.theta),
      orbit.r * Math.cos(orbit.phi),
      orbit.r * Math.sin(orbit.phi) * Math.cos(orbit.theta));
    camera.lookAt(0, 0, 0);
    if (!active) startNext();
    if (active) {
      const t = Math.min(1, (now - active.t0) / active.m.speed);
      pivot.rotation[active.m.axis] = active.m.dir * Math.PI / 2 * ease(t);
      if (t >= 1) finishActive();
    }
    if (timing) ui.time.textContent = fmt(now - timerStart);
    else if (timerEnd) ui.time.textContent = fmt(timerEnd - timerStart);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  refresh();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
